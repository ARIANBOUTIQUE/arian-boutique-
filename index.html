<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أريان بوتيك | ARIAN BOUTIQUE</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-burgundy: #3b111a;
            --accent-gold: #c5a059;
            --bg-cream: #280b12;
            --text-dark: #222;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--primary-burgundy);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 15px 10px;
        }

        .main-card {
            max-width: 450px;
            width: 100%;
            background-color: #280b12;
            border-radius: 20px;
            padding: 40px 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            border: 1px solid rgba(197, 160, 89, 0.4);
            text-align: center;
            position: relative;
        }

        .crown-icon {
            font-size: 38px;
            color: var(--accent-gold);
            margin-bottom: 10px;
        }

        .brand-title {
            font-family: 'Amiri', serif;
            font-size: 42px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 2px;
            letter-spacing: 1px;
        }

        .brand-subtitle {
            font-size: 13px;
            letter-spacing: 5px;
            color: #d1bd9b;
            margin-bottom: 30px;
        }

        .status-title {
            font-family: 'Amiri', serif;
            font-size: 32px;
            color: #fff;
            margin-bottom: 12px;
        }

        .status-desc {
            font-size: 15px;
            color: #e5d5be;
            line-height: 1.7;
            margin-bottom: 25px;
            font-weight: 300;
        }

        .divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
            color: var(--accent-gold);
        }

        .divider-line {
            height: 1px;
            width: 50px;
            background-color: var(--accent-gold);
            opacity: 0.5;
        }

        .icons-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 35px;
        }

        .icon-circle {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1px solid rgba(197, 160, 89, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #d1bd9b;
            font-size: 18px;
        }

        .btn-whatsapp {
            background-color: #25D366;
            color: #fff;
            padding: 14px 28px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
            transition: transform 0.2s;
            width: 100%;
        }

        footer {
            margin-top: 20px;
            font-size: 11px;
            color: #d1bd9b;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="main-card">
        <i class="fa-solid fa-crown crown-icon"></i>
        <h1 class="brand-title">اريان</h1>
        <div class="brand-subtitle">ARIAN BOUTIQUE</div>

        <h2 class="status-title">قريباً . .</h2>
        <p class="status-desc">ترقبوا مجموعتنا الشتوية<br>من الترانشكوتات والقطع الأنيقة</p>

        <div class="divider">
            <div class="divider-line"></div>
            <i class="fa-solid fa-heart" style="font-size: 12px;"></i>
            <div class="divider-line"></div>
        </div>

        <div class="icons-row">
            <div class="icon-circle"><i class="fa-solid fa-vest"></i></div>
            <div class="icon-circle"><i class="fa-solid fa-bag-shopping"></i></div>
            <div class="icon-circle"><i class="fa-solid fa-scarf"></i></div>
            <div class="icon-circle"><i class="fa-regular fa-snowflake"></i></div>
        </div>

        <a href="https://wa.me/970567820608?text=مرحباً%20أريان%20بوتيك،%20أود%20الاستفسار" class="btn-whatsapp" target="_blank">
            <i class="fa-brands fa-whatsapp" style="font-size: 22px;"></i> تواصلوا معنا عبر الواتساب
        </a>
    </div>

    <footer>
        جميع الحقوق محفوظة &copy; 2026 - ARIAN BOUTIQUE
    </footer>

</body>
</html>
