<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أريان بوتيك | ARIAN BOUTIQUE</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-burgundy: #3b111a;
            --dark-burgundy: #280b12;
            --accent-gold: #c5a059;
            --bg-cream: #f9f6f0;
            --card-bg: #f4efe6;
            --text-dark: #222;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-cream);
            color: var(--text-dark);
            padding-bottom: 70px;
        }

        /* Header */
        header {
            background-color: var(--primary-burgundy);
            color: #fff;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-icons {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .header-icons i {
            font-size: 18px;
            cursor: pointer;
        }

        .cart-icon {
            position: relative;
        }

        .cart-badge {
            position: absolute;
            top: -8px;
            right: -8px;
            background-color: var(--accent-gold);
            color: #fff;
            font-size: 10px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .logo-container {
            text-align: center;
        }

        .logo-title {
            font-family: 'Amiri', serif;
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .logo-subtitle {
            font-size: 10px;
            letter-spacing: 3px;
            color: #d1bd9b;
        }

        .menu-icon {
            font-size: 20px;
        }

        /* Hero Banner */
        .hero {
            position: relative;
            background: linear-gradient(rgba(40, 11, 18, 0.55), rgba(40, 11, 18, 0.55)), 
                        url('https://images.unsplash.com/photo-1539109136881-3be0616acf4b?q=80&w=1000&auto=format&fit=crop') center/cover;
            height: 380px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            text-align: center;
            padding: 20px;
        }

        .hero-crown {
            font-size: 28px;
            color: #fff;
            margin-bottom: 5px;
        }

        .hero h1 {
            font-family: 'Amiri', serif;
            font-size: 32px;
            margin-bottom: 2px;
        }

        .hero-sub {
            font-size: 12px;
            letter-spacing: 4px;
            margin-bottom: 25px;
            color: #e5d5be;
        }

        .hero-tagline {
            font-size: 22px;
            font-family: 'Amiri', serif;
            margin-bottom: 5px;
        }

        .hero-desc {
            font-size: 13px;
            opacity: 0.9;
            margin-bottom: 20px;
        }

        .btn-shop {
            background-color: #ffffff;
            color: var(--primary-burgundy);
            padding: 10px 30px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        /* Categories */
        .categories-section {
            padding: 25px 15px;
            display: flex;
            justify-content: space-around;
            text-align: center;
            gap: 10px;
            overflow-x: auto;
        }

        .cat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 70px;
        }

        .cat-icon-box {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background-color: var(--primary-burgundy);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
            border: 2px solid #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .cat-icon-box i {
            font-size: 24px;
        }

        .cat-title {
            font-size: 13px;
            font-weight: bold;
            color: var(--primary-burgundy);
        }

        .cat-sub {
            font-size: 10px;
            color: #777;
        }

        /* Products Section */
        .products-section {
            padding: 10px 15px 30px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid #e0d8cc;
            padding-bottom: 8px;
        }

        .section-header h2 {
            font-size: 18px;
            color: var(--primary-burgundy);
            font-family: 'Amiri', serif;
        }

        .see-all {
            font-size: 13px;
            color: #666;
            text-decoration: none;
        }

        .products-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .product-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }

            position: absolute;
            top: 10px;
            right: 10px;
            background-color: var(--primary-burgundy
