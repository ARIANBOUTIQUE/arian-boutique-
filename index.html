<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أريان بوتيك | ARIAN BOUTIQUE</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }
        body {
            background-color: #f8f9fa;
            color: #333;
        }
        header {
            background-color: #1a1a1a;
            color: #fff;
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        header h1 {
            font-size: 26px;
            letter-spacing: 1px;
        }
        .hero {
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('https://images.unsplash.com/photo-1490481651871-ab68de25d43d?q=80&w=1000&auto=format&fit=crop') center/cover;
            color: white;
            padding: 60px 20px;
            text-align: center;
        }
        .hero h2 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        .hero p {
            font-size: 16px;
            opacity: 0.9;
        }
        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 15px;
        }
        .section-title {
            text-align: center;
            margin-bottom: 25px;
            font-size: 22px;
            color: #1a1a1a;
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
        }
        .product-card {
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            transition: transform 0.2s;
        }
        .product-card:hover {
            transform: translateY(-5px);
        }
        .product-card img {
            width: 100%;
            height: 280px;
            object-fit: cover;
        }
        .product-info {
            padding: 15px;
            text-align: center;
        }
        .product-info h3 {
            font-size: 18px;
            margin-bottom: 8px;
        }
        .price {
            color: #d4af37;
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 12px;
        }
        .btn-buy {
            display: inline-block;
            background-color: #25D366;
            color: white;
            padding: 8px 18px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }
        footer {
            text-align: center;
            padding: 20px;
            background-color: #1a1a1a;
            color: #ccc;
            margin-top: 40px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <header>
        <h1>أريان بوتيك | ARIAN BOUTIQUE</h1>
    </header>

    <section class="hero">
        <h2>أحدث صيحات الموضة والأزياء</h2>
        <p>تشكيلة مميزة وعصرية لتألقك اليومي</p>
    </section>

    <div class="container">
        <h2 class="section-title">أحدث المنتجات</h2>
        
        <div class="products-grid">
            <!-- منتج 1 -->
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?q=80&w=600&auto=format&fit=crop" alt="منتج">
                <div class="product-info">
                    <h3>فستان أنيق</h3>
                    <div class="price">150 شيكل</div>
                    <a href="https://wa.me/970000000000" class="btn-buy">طلب عبر الواتساب</a>
                </div>
            </div>

            <!-- منتج 2 -->
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1539109136881-3be0616acf4b?q=80&w=600&auto=format&fit=crop" alt="منتج">
                <div class="product-info">
                    <h3>طقم عصري</h3>
                    <div class="price">200 شيكل</div>
                    <a href="https://wa.me/970000000000" class="btn-buy">طلب عبر الواتساب</a>
                </div>
            </div>

            <!-- منتج 3 -->
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1485230895905-ec40ba36b9bc?q=80&w=600&auto=format&fit=crop" alt="منتج">
                <div class="product-info">
                    <h3>عباية مميزة</h3>
                    <div class="price">180 شيكل</div>
                    <a href="https://wa.me/970000000000" class="btn-buy">طلب عبر الواتساب</a>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>جميع الحقوق محفوظة &copy; 2026 - أريان بوتيك</p>
    </footer>

</body>
</html>
