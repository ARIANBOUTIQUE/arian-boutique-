<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>أريان بوتيك | ARIAN BOUTIQUE</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #1a060b;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 0;
        }

        /* حاوية التطبيق */
        .app-container {
            width: 100%;
            max-width: 450px;
            min-height: 100vh;
            background-color: #280b12;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
            border-left: 1px solid rgba(197, 160, 89, 0.2);
            border-right: 1px solid rgba(197, 160, 89, 0.2);
        }

        /* الهيدر العلوي للتطبيق */
        .app-header {
            padding: 15px 20px;
            background: linear-gradient(180deg, #1c060c 0%, #280b12 100%);
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(197, 160, 89, 0.25);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .crown-icon {
            color: #c5a059;
            font-size: 20px;
        }

        .brand-name {
            font-family: 'Amiri', serif;
            font-size: 22px;
            color: #fff;
            letter-spacing: 0.5px;
        }

        .status-badge {
            background: rgba(197, 160, 89, 0.15);
            border: 1px solid #c5a059;
            color: #c5a059;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
        }

        /* محتوى التطبيق الرئيسي */
        .app-content {
            flex: 1;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            padding-bottom: 90px;
        }

        /* بطاقات سريعة أعلى الصورة */
        .quick-tags {
            display: flex;
            gap: 8px;
            width: 100%;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .quick-tags::-webkit-scrollbar {
            display: none;
        }

        .tag-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(197, 160, 89, 0.3);
            color: #d1bd9b;
            padding: 6px 14px;
            border-radius: 15px;
            font-size: 12px;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* إطار الصورة الفخمة بالنص */
        .poster-frame {
            width: 100%;
            border-radius: 18px;
            overflow: hidden;
            border: 1px solid rgba(197, 160, 89, 0.4);
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
            background-color: #280b12;
        }

        .main-poster-img {
            width: 100%;
            height: auto;
            display: block;
        }

        footer {
            text-align: center;
            font-size: 11px;
            color: #c5a059;
            opacity: 0.8;
            margin-top: 5px;
        }

        /* الشريط السفلي المثبت (شريط التطبيق) */
        .bottom-app-bar {
            position: fixed;
            bottom: 0;
            width: 100%;
            max-width: 450px;
            background: linear-gradient(0deg, #1c060c 0%, rgba(40, 11, 18, 0.95) 100%);
            padding: 15px 20px;
            border-top: 1px solid rgba(197, 160, 89, 0.3);
            backdrop-filter: blur(10px);
            z-index: 100;
            display: flex;
            justify-content: center;
        }

        .btn-whatsapp-app {
            background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
            color: #fff;
            width: 100%;
            padding: 14px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 20px rgba(37, 211, 102, 0.4);
            transition: transform 0.2s;
        }

        .btn-whatsapp-app:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- الهيدر العلوي للتطبيق -->
        <header class="app-header">
            <div class="header-brand">
                <i class="fa-solid fa-crown crown-icon"></i>
                <span class="brand-name">أريان بوتيك</span>
            </div>
            <span class="status-badge">المجموعة الشتوية</span>
        </header>

        <!-- المحتوى الرئيسي -->
        <main class="app-content">
            <!-- تصنيفات سريعة -->
            <div class="quick-tags">
                <div class="tag-item"><i class="fa-solid fa-snowflake"></i> تشكيلة الشتاء</div>
                <div class="tag-item"><i class="fa-solid fa-vest"></i> ترانشكوتات</div>
                <div class="tag-item"><i class="fa-solid fa-gem"></i> قطع أنيقة</div>
                <div class="tag-item"><i class="fa-solid fa-bag-shopping"></i> طلب سريع</div>
            </div>

            <!-- الصورة المرفوعة بالنص تماماً -->
            <div class="poster-frame">
                <img src="file_0000000024088211b35f4877de6234cc.png" alt="أريان بوتيك - ARIAN BOUTIQUE" class="main-poster-img">
            </div>

            <footer>
                جميع الحقوق محفوظة &copy; 2026 - ARIAN BOUTIQUE
            </footer>
        </main>

        <!-- الشريط السفلي المثبت للواتساب -->
        <div class="bottom-app-bar">
            <a href="https://wa.me/970567820608?text=مرحباً%20أريان%20بوتيك،%20أود%20الاستفسار" class="btn-whatsapp-app" target="_blank">
                <i class="fa-brands fa-whatsapp" style="font-size: 22px;"></i> تواصلوا معنا عبر الواتساب
            </a>
        </div>
    </div>

</body>
</html>
